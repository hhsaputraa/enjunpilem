<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Meta Tags -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="EnjunPilem" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- App Info -->
    <title>EnjunPilem - Movie & TV Streaming</title>
    <meta
      name="description"
      content="Discover and stream your favorite movies and TV shows with EnjunPilem. Your ultimate entertainment destination."
    />
    <meta
      name="keywords"
      content="movies, tv shows, streaming, entertainment, film, serial"
    />
    <meta name="author" content="EnjunPilem Team" />

    <!-- Open Graph -->
    <meta property="og:title" content="EnjunPilem - Movie & TV Streaming" />
    <meta
      property="og:description"
      content="Discover and stream your favorite movies and TV shows"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://enjunpilem.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnjunPilem - Movie & TV Streaming" />
    <meta
      name="twitter:description"
      content="Discover and stream your favorite movies and TV shows"
    />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/icon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/icon-180x180.png"
    />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#8b5cf6" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- CSS Variables for safe areas -->
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-right: env(safe-area-inset-right);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --safe-area-inset-left: env(safe-area-inset-left);
      }

      /* Prevent zoom on input focus (iOS) */
      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      /* Hide scrollbars but keep functionality */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
