<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Meta Tags -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="EnjunPilem" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- App Info -->
    <title>EnjunPilem - Movie & TV Streaming</title>
    <meta
      name="description"
      content="Discover and stream your favorite movies and TV shows with EnjunPilem. Your ultimate entertainment destination."
    />
    <meta
      name="keywords"
      content="movies, tv shows, streaming, entertainment, film, serial"
    />
    <meta name="author" content="EnjunPilem Team" />

    <!-- Open Graph -->
    <meta property="og:title" content="EnjunPilem - Movie & TV Streaming" />
    <meta
      property="og:description"
      content="Discover and stream your favorite movies and TV shows"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://enjunpilem.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnjunPilem - Movie & TV Streaming" />
    <meta
      name="twitter:description"
      content="Discover and stream your favorite movies and TV shows"
    />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/icon-180x180.png"
    />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#8b5cf6" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Supabase — dipakai untuk auth, preconnect agar koneksi siap lebih cepat -->
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <!-- Google OAuth hanya dipakai di halaman /auth, tidak perlu preconnect di semua halaman -->
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- CSS Variables for safe areas -->
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-right: env(safe-area-inset-right);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --safe-area-inset-left: env(safe-area-inset-left);
      }

      /* Prevent zoom on input focus (iOS) */
      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      /* Hide scrollbars but keep functionality */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* CRITICAL CSS: Ensure hero section is visible immediately for LCP */
      /* This prevents the "blank screen" issue that causes NO_LCP error */
      #root {
        min-height: 100vh;
        background-color: #09090b; /* bg-background */
      }
      
      /* Reserve space for hero section to prevent layout shift */
      .hero-container {
        min-height: 400px;
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
